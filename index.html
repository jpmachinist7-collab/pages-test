<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>稼働ログ v1.23</title>
<style>
  :root {
    --bg: #070d1f;
    --panel: #10192f;
    --panel-2: #0c1424;
    --border: #1c2b4a;
    --cyan: #00e5ff;
    --cyan-dim: #0a4a56;
    --red: #ff6b6b;
    --red-dim: #4a1a1a;
    --text: #e6f4f8;
    --muted: #6f8199;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    height: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 148px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--cyan);
    margin: 4px 0 2px;
  }
  .today-line {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 14px;
    overflow-wrap: anywhere;
  }
  h2 {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 10px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .panel.base { border-color: var(--cyan-dim); }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select, input[type=text], input[type=number], input[type=tel] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 8px;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--cyan); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  button { font-family: inherit; border: none; cursor: pointer; }
  .btn {
    background: var(--panel-2);
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn:active { background: var(--cyan-dim); }
  .btn:disabled { color: var(--muted); border-color: var(--border); }
  .btn-primary {
    background: var(--cyan);
    color: #04202a;
    border: 1px solid var(--cyan);
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    border-radius: 9px;
    font-weight: 700;
  }
  .btn-primary:disabled {
    background: var(--panel-2);
    color: var(--muted);
    border-color: var(--border);
  }
  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red-dim);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 2px 10px;
    padding: 6px 0;
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 0;
  }
  .stat span, .stat b { overflow-wrap: anywhere; min-width: 0; }
  .stat b { color: var(--text); font-size: 0.95rem; }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .step-label {
    font-size: 0.7rem;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .elapsed-display { text-align: center; padding: 10px 0 4px; }
  .elapsed-display .num { font-size: 2.2rem; font-weight: 700; color: var(--cyan); line-height: 1; }
  .elapsed-display .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0a1124;
    border-top: 1px solid var(--border);
    padding: 10px 10px max(10px, env(safe-area-inset-bottom));
    z-index: 20;
  }
  .tabbar .mode-toggle { margin-bottom: 8px; }
  .tab-row { display: flex; }
  .tab-btn {
    flex: 1; background: none; color: var(--muted);
    font-size: 0.72rem; padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab-btn.active { color: var(--cyan); }
  .tab-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
  .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 8px; }
  .date-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
  }
  .date-row:last-child { border-bottom: none; }
  .date-row .d-label { font-size: 0.95rem; font-weight: 600; }
  .date-row .d-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .date-row .chev { color: var(--muted); font-size: 0.8rem; }
  .date-detail { padding: 4px 4px 10px; }
  .log-entry { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .log-entry:last-child { border-bottom: none; }
  .log-entry-head { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
  .log-entry-head .machine { color: var(--muted); }
  .log-entry-order { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  .log-entry-sub { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; margin-top: 2px; }
  .stop-chip {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px;
    background: var(--red-dim); color: var(--red); margin-top: 4px;
  }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .master-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .master-item:last-child { border-bottom: none; }
  .master-item span { flex: 1; font-size: 0.9rem; }
  .add-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .toast {
    position: fixed; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); left: 50%; z-index: 30; transform: translateX(-50%);
    background: var(--cyan); color: #04202a; font-weight: 700;
    padding: 9px 18px; border-radius: 20px; font-size: 0.85rem;
    opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ---------- process counter (工程カウンター) ---------- */
  .mode-toggle {
    display: flex;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    background: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 9px 4px;
    border-radius: 7px;
  }
  .mode-btn.active { background: var(--cyan); color: #04202a; }
  .order-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .order-card.running { border-color: var(--cyan); }
  .order-card-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .order-card-head .order-no { font-size: 1rem; font-weight: 700; letter-spacing: 0.02em; }
  .play-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--panel-2); color: var(--cyan);
    border: 1px solid var(--cyan-dim); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .order-card.running .play-btn { background: var(--cyan); color: #04202a; }
  .process-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .process-chip {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;
  }
  .process-chip.selected { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan); }
  .order-timer {
    text-align: center; font-size: 1.7rem; font-weight: 700; color: var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  .order-timer-label { text-align: center; font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .process-breakdown { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .breakdown-group-label {
    font-size: 0.68rem; color: var(--cyan); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; margin: 6px 0 2px;
  }
  .breakdown-group-label.overtime { color: var(--red); }
  .process-breakdown-row {
    display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); padding: 3px 0;
  }
  .remove-order-btn {
    background: none; color: var(--red); border: none; font-size: 0.75rem; margin-top: 8px;
  }
  .finalize-panel {
    background: var(--panel); border: 1px solid var(--cyan-dim); border-radius: 10px;
    padding: 14px; margin-top: 4px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- storage abstraction (works in Claude artifact preview & real deployment) ----------
const storage = {
  async get(key) {
    if (window.storage) {
      try { const r = await window.storage.get(key); return r ? r.value : null; }
      catch (e) { return null; }
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    if (window.storage) {
      try { await window.storage.set(key, value); return; } catch (e) {}
    }
    try { localStorage.setItem(key, value); } catch (e) {}
  }
};
const DATA_KEY = 'machine-log-data-v3';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() { const d = new Date(); return d.toISOString().slice(0, 10); }
function fmtDateJp(dstr) {
  const d = new Date(dstr + 'T00:00:00');
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w})`;
}
function roundQuarter(x) { return Math.round(x * 4) / 4; }
function fmtHours(x) { return (Math.round(x * 100) / 100).toString(); }

// ---------- counter reading: raw digits -> "H:MM", last 2 digits = minutes ----------
function digitsToMinutes(digits) {
  const clean = (digits || '').replace(/\D/g, '');
  if (clean.length === 0) return null;
  const hoursPart = clean.length > 2 ? clean.slice(0, -2) : '0';
  const minutesPart = clean.length > 2 ? clean.slice(-2) : clean.padStart(2, '0');
  return parseInt(hoursPart, 10) * 60 + parseInt(minutesPart, 10);
}
function digitsToDisplay(digits) {
  const clean = (digits || '').replace(/\D/g, '');
  if (clean.length === 0) return '';
  const hoursPart = clean.length > 2 ? clean.slice(0, -2) : '0';
  const minutesPart = clean.length > 2 ? clean.slice(-2) : clean.padStart(2, '0');
  return `${parseInt(hoursPart, 10)}:${minutesPart}`;
}
function minutesToDisplay(totalMin) {
  if (totalMin === null || totalMin === undefined) return '';
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}:${String(m).padStart(2, '0')}`;
}

// ---------- order number: 00-00000-000-00-000 (2-5-3-2-3 digits) ----------
function formatOrderNumber(raw) {
  const digits = (raw || '').replace(/\D/g, '').slice(0, 15);
  const parts = [digits.slice(0,2), digits.slice(2,7), digits.slice(7,10), digits.slice(10,12), digits.slice(12,15)];
  return parts.filter(p => p.length > 0).join('-');
}
function orderNumberDigitCount(v) { return (v || '').replace(/-/g, '').length; }

function defaultData() {
  return {
    machines: [{ id: uid(), name: 'マシニング1号機', lastReadingMinutes: null, lastReadingDigits: '', lastDate: null, pendingOrderDigits: '' }],
    stopReasons: ['段取り替え', '工具交換', 'チョコ停', '材料待ち', '計画停止', 'その他'],
    logs: [],
    processes: ['CAD/CAM', '段取り', '工程内検査', 'プログラム作成', 'その他'],
    activeOrders: [],
    processLogs: [],
    breaks: [
      { id: uid(), name: '昼休み', start: '12:00', end: '12:50' },
      { id: uid(), name: '中休み', start: '15:00', end: '15:10' },
      { id: uid(), name: '夕休み', start: '17:30', end: '17:45' }
    ],
    dayShiftStart: '08:30',
    dayShiftEnd: '17:30',
    autoStart: { time: '08:30', orderNumber: '', process: '' },
    autoStopTime: '',
    autoStartDoneDate: null,
    autoStopDoneDate: null
  };
}

let state = {
  data: null,
  mode: 'machine',
  tabByMode: { machine: 'record', process: 'record' },
  selectedMachineId: null,
  endDigits: '',
  stopReasons: [],
  historyFilterMachine: 'all',
  expandedDate: null,
  editingMachineId: null,
  editMachineName: '',
  editingReasonIdx: null,
  editReasonName: '',
  newOrderDigits: '',
  editingProcessIdx: null,
  editProcessName: '',
  processHistoryExpandedDate: null,
  showFinalizeConfirm: false,
  showDailySummary: false,
  editingOrderId: null,
  editOrderDigits: '',
  editingLogId: null,
  editingStartMachineId: null,
  editStartDigits: '',
  editStartDate: '',
  editLogStopReasons: [],
  editingBreakIdx: null,
  editBreakDraft: { name: '', start: '', end: '' }
};

async function loadData() {
  const raw = await storage.get(DATA_KEY);
  if (raw) {
    try { state.data = JSON.parse(raw); } catch (e) { state.data = defaultData(); }
  } else {
    state.data = defaultData();
  }
  // backward compatibility for data saved before the process-counter feature existed
  if (!state.data.processes) state.data.processes = ['CAD/CAM', '段取り', '工程内検査', 'プログラム作成', 'その他'];
  if (!state.data.activeOrders) state.data.activeOrders = [];
  if (!state.data.breaks) state.data.breaks = [
    { id: uid(), name: '昼休み', start: '12:00', end: '12:50' },
    { id: uid(), name: '中休み', start: '15:00', end: '15:10' },
    { id: uid(), name: '夕休み', start: '17:30', end: '17:45' }
  ];
  if (!state.data.dayShiftStart) state.data.dayShiftStart = '08:30';
  if (!state.data.dayShiftEnd) state.data.dayShiftEnd = '17:30';
  if (!state.data.autoStart) state.data.autoStart = { time: '08:30', orderNumber: '', process: '' };
  if (state.data.autoStopTime === undefined) state.data.autoStopTime = '';
  if (!state.data.processLogs) state.data.processLogs = [];
  if (!state.selectedMachineId && state.data.machines.length) {
    state.selectedMachineId = state.data.machines[0].id;
  }
}
async function saveData() { await storage.set(DATA_KEY, JSON.stringify(state.data)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// ---------- save a file: use the native share sheet (Files/Dropbox/etc.) when available ----------
async function shareOrDownload(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  try {
    const file = new File([blob], filename, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
  } catch (e) {
    // user cancelled share, or share failed — fall back to a normal download link
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>稼働ログ <span style="font-size:0.62em; color:var(--muted); font-weight:400;">v1.23</span></h1>
    <div class="today-line">今日の日付：${fmtDateJp(todayStr())}</div>
    ${state.mode === 'machine' ? renderMachineMode() : renderProcessMode()}
    <div class="tabbar">
      <div class="mode-toggle">
        <button class="mode-btn ${state.mode === 'machine' ? 'active' : ''}" data-mode="machine">機械稼働</button>
        <button class="mode-btn ${state.mode === 'process' ? 'active' : ''}" data-mode="process">工程カウンター</button>
      </div>
      <div class="tab-row">
        ${tabBtn('record', '記録')}
        ${tabBtn('history', '履歴')}
        ${tabBtn('master', 'マスタ管理')}
      </div>
    </div>
  `;
  refreshVolatileUiBits();
}
// small per-render tasks that don't need full event (re)binding, since events are
// handled by permanent delegated listeners set up once in bindDelegatedHandlers()
function refreshVolatileUiBits() {
  // (intentionally left minimal: auto-focusing inputs here caused the keyboard to
  // pop unexpectedly on unrelated re-renders, e.g. right after tapping a bottom tab,
  // which shifted the layout and made the next tap land on the wrong element)
}
function getActiveTab() { return state.tabByMode[state.mode]; }
function renderMachineMode() {
  const tab = state.tabByMode.machine;
  return `
    ${tab === 'record' ? renderRecordTab() : ''}
    ${tab === 'history' ? renderHistoryTab() : ''}
    ${tab === 'master' ? renderMasterTab() : ''}
  `;
}
function renderProcessMode() {
  const tab = state.tabByMode.process;
  return `
    ${tab === 'record' ? renderProcessRecordTab() : ''}
    ${tab === 'history' ? renderProcessHistoryTab() : ''}
    ${tab === 'master' ? renderProcessMasterTab() : ''}
  `;
}
function tabBtn(id, label) {
  return `<button class="tab-btn ${getActiveTab() === id ? 'active' : ''}" data-tab="${id}"><span class="dot"></span>${label}</button>`;
}
function getMachine(id) { return state.data.machines.find(m => m.id === id); }

function renderRecordTab() {
  const machines = state.data.machines;
  if (!machines.length) {
    return `<div class="panel empty">機械が登録されていません。<br>「マスタ管理」タブから追加してください。</div>`;
  }
  const machine = getMachine(state.selectedMachineId) || machines[0];
  const hasPrev = machine.lastReadingMinutes !== null && machine.lastReadingMinutes !== undefined;

  const machinePanel = `
    <div class="panel">
      <label>機械</label>
      <select id="machine-select">
        ${machines.map(m => `<option value="${m.id}" ${m.id === machine.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}
      </select>
    </div>
  `;

  if (!hasPrev) {
    const currentMinutes = digitsToMinutes(state.endDigits);
    return machinePanel + `
      <div class="panel base">
        <div class="step-label">初回登録</div>
        <label>基準となるカウンター値（機械の表示のまま）</label>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" id="base-reading-input" placeholder="例：12345612 → 123456:12" value="${digitsToDisplay(state.endDigits)}">
      </div>
      <button class="btn-primary" id="save-base-btn" data-action="save-base" ${currentMinutes === null ? 'disabled' : ''}>基準として保存</button>
    `;
  }

  const endMinutes = digitsToMinutes(state.endDigits);
  const rawElapsed = endMinutes !== null ? Math.max(0, endMinutes - machine.lastReadingMinutes) / 60 : null;
  const elapsed = rawElapsed !== null ? roundQuarter(rawElapsed) : null;
  const orderComplete = orderNumberDigitCount(machine.pendingOrderDigits) === 15;
  const canSave = orderComplete && endMinutes !== null;

  return machinePanel + `
    <div class="panel">
      <div class="step-label">開始</div>
      ${state.editingStartMachineId === machine.id ? `
        <div class="field">
          <label>開始のカウンター値（機械の表示のまま）</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" id="edit-start-reading-input" placeholder="例：12345612 → 123456:12" value="${digitsToDisplay(state.editStartDigits)}">
        </div>
        <div class="field">
          <label>開始の日付</label>
          <input type="date" id="edit-start-date-input" value="${escapeHtml(state.editStartDate)}">
        </div>
        <div class="add-row">
          <button class="btn" data-action="save-start" data-id="${machine.id}">保存</button>
          <button class="btn-danger" data-action="cancel-edit-start">取消</button>
        </div>
      ` : `
        <div class="stat">
          <span>${escapeHtml(fmtDateJp(machine.lastDate))}</span>
          <b>${minutesToDisplay(machine.lastReadingMinutes)}</b>
        </div>
        <button class="remove-order-btn" data-action="edit-start" data-id="${machine.id}" style="margin-top:0;">開始の値を編集</button>
      `}
      <div class="field" style="margin-top:10px;">
        <label>受注番号</label>
        <div class="row">
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" id="order-number-input" placeholder="00-00000-000-00-000" value="${formatOrderNumber(machine.pendingOrderDigits)}">
          <button class="btn-danger" data-action="clear-order-number" data-id="${machine.id}" style="flex:0 0 auto;">削除</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="step-label">終了</div>
      <div class="field">
        <label>終了時のカウンター値</label>

function fmtDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtHM(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}
function fmtHoursQuarter(totalSeconds) {
  return fmtHours(roundQuarter(Math.max(0, totalSeconds) / 3600)) + 'h';
}
function fmtDualTime(totalSeconds) {
  return `${fmtHM(totalSeconds)}<span style="font-size:0.7em; color:var(--muted);"> (${fmtHoursQuarter(totalSeconds)})</span>`;
}
function orderTotalSeconds(order) {
  return Object.values(order.totals || {}).reduce((a, b) => a + b, 0);
}
// the totals dict key currently being accumulated: plain process name normally,
// or "工程名（残業）" once this order has crossed into overtime for the day —
// this keeps the process itself unchanged while separating overtime hours
function isDayShiftNow() {
  const start = timeStrToMinutes(state.data.dayShiftStart || '08:30');
  const end = timeStrToMinutes(state.data.dayShiftEnd || '17:30');
  const now = nowMinutesOfDay();
  return now >= start && now < end;
}
function effectiveBucketKey(order) {
  if (!order.currentProcess) return null;
  return isDayShiftNow() ? order.currentProcess : `${order.currentProcess}${OVERTIME_SUFFIX}`;
}
function orderCurrentDisplaySeconds(order, bucketKey) {
  const base = (order.totals && order.totals[bucketKey]) || 0;
  return base + (pendingBuckets(order, Date.now())[bucketKey] || 0);
}

function renderOrderBreakdown(o) {
  const liveTotals = { ...(o.totals || {}) };
  Object.keys(pendingBuckets(o, Date.now())).forEach(k => { if (!(k in liveTotals)) liveTotals[k] = 0; });
  if (o.running && o.activeBucketKey && !(o.activeBucketKey in liveTotals)) liveTotals[o.activeBucketKey] = 0;
  const entries = Object.entries(liveTotals).filter(([k, v]) => v > 0 || (o.running && k === o.activeBucketKey));
  const dayEntries = entries.filter(([k]) => !isOvertimeKey(k));
  const otEntries = entries.filter(([k]) => isOvertimeKey(k));
  if (dayEntries.length === 0 && otEntries.length === 0) return '';

  const renderRow = ([p, v]) => `
    <div class="process-breakdown-row"><span>${escapeHtml(dayLabelFromKey(p))}</span><span data-timer-proc="${o.id}:${escapeHtml(p)}">${fmtDualTime(orderCurrentDisplaySeconds(o, p))}</span></div>

  return `

      ${dayEntries.length > 0 ? `

        ${dayEntries.map(renderRow).join('')}
      ` : ''}
      ${otEntries.length > 0 ? `

  `;
}

function fmtDateShort(dstr) {
  const d = new Date(dstr + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
const OVERTIME_LABEL = '残業';
const AUTO_START_GRACE_MIN = 60;
function processLabel(code, name) { return code ? `${code}/${name}` : name; }
function splitProcessLabel(label) {
  const m = /^(\d{3})\/(.*)$/.exec(label || '');
  return m ? { code: m[1], name: m[2] } : { code: '', name: label || '' };
}
// keep running cards and the auto-start preset pointing at a renamed process
function renameProcessEverywhere(oldL, newL) {
  const mapKey = k => k === oldL ? newL : (k === oldL + OVERTIME_SUFFIX ? newL + OVERTIME_SUFFIX : k);
  state.data.activeOrders.forEach(o => {
    if (o.currentProcess === oldL) o.currentProcess = newL;
    const nt = {};
    Object.entries(o.totals || {}).forEach(([k, v]) => { const nk = mapKey(k); nt[nk] = (nt[nk] || 0) + v; });
    o.totals = nt;
    if (o.activeBucketKey) o.activeBucketKey = mapKey(o.activeBucketKey);
  });
  if (state.data.autoStart && state.data.autoStart.process === oldL) state.data.autoStart.process = newL;
}
function readProcessInputs(codeId, nameId) {
  const code = document.getElementById(codeId).value.replace(/\D/g, '');
  const name = document.getElementById(nameId).value.trim();
  if (!name) { showToast('工程名を入力してください'); return null; }
  if (code && code.length !== 3) { showToast('工程番号は3桁で入力してください'); return null; }
  return processLabel(code, name);
}
const OVERTIME_SUFFIX = `（${OVERTIME_LABEL}）`;
function isOvertimeKey(key) { return key.endsWith(OVERTIME_SUFFIX); }
function dayLabelFromKey(key) { return isOvertimeKey(key) ? key.slice(0, -OVERTIME_SUFFIX.length) : key; }
const CHART_PALETTE = ['#00e5ff','#ff6b6b','#ffd166','#8fd3ff','#c792ea','#7ee787','#f78c6c','#82aaff'];

function renderProcessChart() {
  const logs = state.data.processLogs;
  if (logs.length === 0) return '';

  const byDate = {};
  logs.forEach(l => {
    byDate[l.date] = byDate[l.date] || {};
    byDate[l.date][l.process] = (byDate[l.date][l.process] || 0) + l.seconds;
  });
  const dates = Object.keys(byDate).sort().slice(-14);
  const processesUsed = [...new Set(logs.map(l => l.process))];
  const colorMap = {};
  processesUsed.forEach((p, i) => { colorMap[p] = CHART_PALETTE[i % CHART_PALETTE.length]; });

  const dayTotalsHours = dates.map(d => roundQuarter(Object.values(byDate[d]).reduce((s, v) => s + v, 0) / 3600));
  const maxHours = Math.max(1, ...dayTotalsHours);
  const barW = 28, gap = 12, chartH = 150;
  const pxPerHour = chartH / maxHours;

  const bars = dates.map((d, i) => {
    const procs = byDate[d];
    let yOffset = chartH;
    const x = i * (barW + gap);
    const segments = Object.entries(procs).map(([p, sec]) => {
      const hRounded = roundQuarter(sec / 3600);
      const segH = hRounded * pxPerHour;
      if (segH <= 0) return '';
      yOffset -= segH;
      return `<rect x="${x}" y="${yOffset}" width="${barW}" height="${segH}" fill="${colorMap[p]}" rx="2"/>`;
    }).join('');
    const total = dayTotalsHours[i];
    return segments +
      `<text x="${x + barW/2}" y="${yOffset - 4}" font-size="9" fill="#e6f4f8" text-anchor="middle">${fmtHours(total)}</text>` +
      `<text x="${x + barW/2}" y="${chartH + 14}" font-size="9" fill="#6f8199" text-anchor="middle">${fmtDateShort(d)}</text>`;
  }).join('');

  const width = Math.max(dates.length * (barW + gap), 200);
  const legend = processesUsed.map(p =>
    `<span style="display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0;">
      <span style="width:10px; height:10px; background:${colorMap[p]}; border-radius:2px; display:inline-block;"></span>
      <span style="font-size:0.72rem; color:var(--muted);">${escapeHtml(p)}</span>
    </span>`).join('');

  return `
    <div class="panel">
      <h2>工程別 稼働時間の推移（直近${dates.length}日）</h2>
      <div style="overflow-x:auto;">
        <svg width="${width}" height="${chartH + 28}" viewBox="0 0 ${width} ${chartH + 28}">${bars}</svg>
      </div>
      <div style="margin-top:8px; display:flex; flex-wrap:wrap;">${legend}</div>
    </div>
  `;
}

function escapeHtml(s) {

}

// ---------- event handling: permanent delegated listeners (bound once in init) ----------
// Binding directly to #app (which itself is never replaced, only its innerHTML)
// avoids the iOS Safari issue where re-binding onclick on freshly-created elements
// after every render() can require an extra tap before it registers.
function bindDelegatedHandlers() {
  const app = document.getElementById('app');

  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-tab],[data-mode],[data-action]');
    if (!t) return;

    if (t.dataset.tab) { state.tabByMode[state.mode] = t.dataset.tab; render(); return; }
    if (t.dataset.mode) { state.mode = t.dataset.mode; render(); return; }

    const action = t.dataset.action;
    switch (action) {
      case 'save-base': await handleSaveBase(); break;
      case 'save-cycle': await handleSaveCycle(); break;
      case 'toggle-stop-reason': {
        const r = t.dataset.reason;
        const idx = state.stopReasons.indexOf(r);
        if (idx === -1) state.stopReasons.push(r); else state.stopReasons.splice(idx, 1);
        render();
        break;
      }
      case 'clear-order-number': {
        const m = getMachine(t.dataset.id);
        m.pendingOrderDigits = '';
        await saveData();
        render();
        break;
      }
      case 'edit-start': {
        const m = getMachine(t.dataset.id);
        state.editingStartMachineId = m.id;
        state.editStartDigits = m.lastReadingDigits || '';
        state.editStartDate = m.lastDate || todayStr();
        render();
        break;
      }
      case 'cancel-edit-start': state.editingStartMachineId = null; render(); break;
      case 'save-start': {
        const m = getMachine(t.dataset.id);
        const minutes = digitsToMinutes(state.editStartDigits);
        if (minutes === null) { showToast('カウンター値を入力してください'); return; }
        const date = document.getElementById('edit-start-date-input').value;
        if (!date) { showToast('日付を入力してください'); return; }
        m.lastReadingMinutes = minutes;
        m.lastReadingDigits = state.editStartDigits;
        m.lastDate = date;
        state.editingStartMachineId = null;
        await saveData();
        showToast('開始の値を更新しました');
        render();
        break;
      }
      case 'edit-log-reasons': {
        const log = state.data.logs.find(l => l.id === t.dataset.id);
        state.editingLogId = log.id;
        state.editLogStopReasons = [...(log.stopReasons || (log.stopReason ? [log.stopReason] : []))];
        render();
        break;
      }
      case 'toggle-edit-log-reason': {
        const r = t.dataset.reason;
        const idx = state.editLogStopReasons.indexOf(r);
        if (idx === -1) state.editLogStopReasons.push(r); else state.editLogStopReasons.splice(idx, 1);
        render();
        break;
      }
      case 'cancel-edit-log-reasons': state.editingLogId = null; render(); break;
      case 'save-log-reasons': {
        const log = state.data.logs.find(l => l.id === t.dataset.id);
        log.stopReasons = [...state.editLogStopReasons];
        delete log.stopReason;
        state.editingLogId = null;
        await saveData();
        render();
        break;
      }

      case 'add-break-btn': {
        const name = document.getElementById('new-break-name').value.trim();
        const start = document.getElementById('new-break-start').value;
        const end = document.getElementById('new-break-end').value;
        if (!name || !start || !end) { showToast('名称・開始・終了をすべて入力してください'); return; }
        state.data.breaks.push({ id: uid(), name, start, end });
        await saveData();
        render();
        break;
      }
      case 'delete-break': {
        state.data.breaks.splice(parseInt(t.dataset.idx), 1);
        await saveData();
        render();
        break;
      }
      case 'edit-break': {
        const idx = parseInt(t.dataset.idx);
        const b = state.data.breaks[idx];
        state.editingBreakIdx = idx;
        state.editBreakDraft = { name: b.name, start: b.start, end: b.end };
        render();
        break;
      }
      case 'cancel-edit-break': state.editingBreakIdx = null; render(); break;
      case 'save-break': {
        const idx = parseInt(t.dataset.idx);
        const name = document.getElementById('edit-break-name').value.trim();
        const start = document.getElementById('edit-break-start').value;
        const end = document.getElementById('edit-break-end').value;
        if (!name || !start || !end) { showToast('名称・開始・終了をすべて入力してください'); return; }
        state.data.breaks[idx] = { ...state.data.breaks[idx], name, start, end };
        state.editingBreakIdx = null;
        await saveData();
        render();
        break;
      }
      case 'save-dayshift-times': {
        const start = document.getElementById('dayshift-start-input').value;
        const end = document.getElementById('dayshift-end-input').value;
        if (!start || !end) { showToast('開始・終了の両方を入力してください'); return; }
        state.data.dayShiftStart = start;
        state.data.dayShiftEnd = end;
        await saveData();
        showToast('保存しました');
        render();
        break;
      }

      case 'add-machine-btn': {
        const inp = document.getElementById('new-machine-name');
        const name = inp.value.trim();
        if (!name) return;
        state.data.machines.push({ id: uid(), name, lastReadingMinutes: null, lastReadingDigits: '', lastDate: null, pendingOrderDigits: '' });
        await saveData();
        render();
        break;
      }
      case 'delete-machine': {
        state.data.machines = state.data.machines.filter(m => m.id !== t.dataset.id);
        if (state.selectedMachineId === t.dataset.id) state.selectedMachineId = state.data.machines[0]?.id || null;
        await saveData();
        render();
        break;
      }
      case 'edit-machine': {
        const m = getMachine(t.dataset.id);
        state.editingMachineId = m.id;
        state.editMachineName = m.name;
        render();
        const inp = document.getElementById('edit-machine-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        break;
      }
      case 'cancel-edit-machine': state.editingMachineId = null; render(); break;
      case 'save-machine-name': {
        const name = state.editMachineName.trim();
        if (!name) return;
        const m = getMachine(t.dataset.id);
        m.name = name;
        state.editingMachineId = null;
        await saveData();
        render();
        break;
      }

      case 'add-reason-btn': {
        const inp = document.getElementById('new-reason-name');
        const name = inp.value.trim();
        if (!name) return;
        state.data.stopReasons.push(name);
        await saveData();
        render();
        break;
      }
      case 'delete-reason': {
        state.data.stopReasons.splice(parseInt(t.dataset.idx), 1);
        await saveData();
        render();
        break;
      }
      case 'edit-reason': {
        const idx = parseInt(t.dataset.idx);
        state.editingReasonIdx = idx;
        state.editReasonName = state.data.stopReasons[idx];
        render();
        const inp = document.getElementById('edit-reason-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        break;
      }
      case 'cancel-edit-reason': state.editingReasonIdx = null; render(); break;
      case 'save-reason-name': {
        const name = state.editReasonName.trim();
        if (!name) return;
        const idx = parseInt(t.dataset.idx);
        state.data.stopReasons[idx] = name;
        state.editingReasonIdx = null;
        await saveData();
        render();
        break;
      }

      case 'toggle-date': {
        const d = t.dataset.date;
        state.expandedDate = state.expandedDate === d ? null : d;
        render();
        break;
      }
      case 'delete-log': {
        if (!confirm('この記録を削除します。よろしいですか？')) return;
        state.data.logs = state.data.logs.filter(l => l.id !== t.dataset.id);
        await saveData();
        showToast('削除しました');
        render();
        break;
      }
      case 'delete-date': {
        if (!confirm(`${fmtDateJp(t.dataset.date)}の記録をすべて削除します。よろしいですか？`)) return;
        const filterMachine = state.historyFilterMachine;
        state.data.logs = state.data.logs.filter(l => {
          if (l.date !== t.dataset.date) return true;
          if (filterMachine !== 'all' && l.machineId !== filterMachine) return true;
          return false;
        });
        await saveData();
        showToast('削除しました');
        render();
        break;
      }
      case 'clear-all-logs': {
        const filterMachine = state.historyFilterMachine;
        const targetCount = state.data.logs.filter(l => filterMachine === 'all' || l.machineId === filterMachine).length;
        if (targetCount === 0) return;
        const msg = filterMachine === 'all'
          ? 'すべての機械の履歴をすべて削除します。元に戻せません。よろしいですか？'
          : '選択中の機械の履歴をすべて削除します。元に戻せません。よろしいですか？';
        if (!confirm(msg)) return;
        state.data.logs = state.data.logs.filter(l => !(filterMachine === 'all' || l.machineId === filterMachine));
        await saveData();
        showToast('削除しました');
        render();
        break;
      }
      case 'export-csv': exportCsv(); break;
      case 'export-backup':
        shareOrDownload(JSON.stringify(state.data, null, 2), `machine-log-backup-${todayStr()}.json`, 'application/json');
        break;
      case 'import-backup-btn': document.getElementById('import-file-input').click(); break;

      // ---------- process counter ----------
      case 'add-order': {
        if (orderNumberDigitCount(state.newOrderDigits) !== 15) return;
        state.data.activeOrders.push({
          id: uid(), orderNumber: formatOrderNumber(state.newOrderDigits),
          currentProcess: null, running: false, lastResumeAt: null, totals: {},
          onBreak: false, preBreakProcess: null, activeBucketKey: null
        });
        state.newOrderDigits = '';
        await saveData();
        render();
        break;
      }
      case 'toggle-run': {
        const order = state.data.activeOrders.find(o => o.id === t.dataset.id);
        if (!order.currentProcess) { showToast('先に工程を選んでください'); return; }
        if (order.running) {
          flushOrder(order);
          order.running = false;
          order.lastResumeAt = null;
          order.breakOverride = false;
        } else {
          state.data.activeOrders.forEach(o => {
            if (o.id === order.id) return;
            if (o.running) { flushOrder(o); o.running = false; o.lastResumeAt = null; }
            // only one card counts at a time: drop other cards' pending auto-resume
            o.onBreak = false;
            o.breakOverride = false;
          });
          order.running = true;
          order.lastResumeAt = Date.now();
          order.activeBucketKey = effectiveBucketKey(order);
          order.onBreak = false;
          // started manually during a break: keep it running (don't auto-pause it)
          order.breakOverride = !!getCurrentBreak();
          // the card being counted always sits at the top
          state.data.activeOrders = [order, ...state.data.activeOrders.filter(o => o.id !== order.id)];
        }
        await saveData();
        render();
        break;
      }
      case 'select-process': {
        const order = state.data.activeOrders.find(o => o.id === t.dataset.id);
        const newProcess = t.dataset.process;
        if (order.currentProcess === newProcess) return;
        if (order.running) flushOrder(order);
        order.currentProcess = newProcess;
        if (order.running) {
          order.lastResumeAt = Date.now();
          order.activeBucketKey = effectiveBucketKey(order);
        }
        await saveData();
        render();
        break;
      }
      case 'remove-order': {
        const order = state.data.activeOrders.find(o => o.id === t.dataset.id);
        if (order && orderTotalSeconds(order) > 0) {
          if (!confirm('この受注番号にはすでに記録された時間があります。削除すると失われますがよろしいですか？')) return;
        }
        state.data.activeOrders = state.data.activeOrders.filter(o => o.id !== t.dataset.id);
        await saveData();
        render();
        break;
      }
      case 'edit-order': {
        const order = state.data.activeOrders.find(o => o.id === t.dataset.id);
        state.editingOrderId = order.id;
        state.editOrderDigits = order.orderNumber.replace(/-/g, '');
        render();
        const inp = document.getElementById('edit-order-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        break;
      }
      case 'cancel-edit-order': state.editingOrderId = null; render(); break;
      case 'save-order-number': {
        if (orderNumberDigitCount(state.editOrderDigits) !== 15) return;
        const order = state.data.activeOrders.find(o => o.id === t.dataset.id);
        order.orderNumber = formatOrderNumber(state.editOrderDigits);
        state.editingOrderId = null;
        await saveData();
        render();
        break;
      }
      case 'show-daily-summary': state.showDailySummary = true; render(); break;
      case 'hide-daily-summary': state.showDailySummary = false; render(); break;
      case 'finalize': {
        if (!confirm('本日の集計を履歴に保存し、時間をリセットします（受注番号のカードは残ります）。よろしいですか？')) return;
        const date = todayStr();
        state.data.activeOrders.forEach(o => {
          if (o.running) flushOrder(o);
          Object.entries(o.totals || {}).forEach(([process, seconds]) => {
            if (seconds > 0) state.data.processLogs.push({ id: uid(), date, orderNumber: o.orderNumber, process, seconds, savedAt: Date.now() });
          });
          o.totals = {};
          o.running = false;
          o.lastResumeAt = null;
          o.currentProcess = null;
          o.activeBucketKey = null;
        });
        state.showDailySummary = false;
        await saveData();
        showToast('集計を保存しました');
        render();
        break;
      }
      case 'toggle-process-date': {
        const d = t.dataset.date;
        state.processHistoryExpandedDate = state.processHistoryExpandedDate === d ? null : d;
        render();
        break;
      }
      case 'delete-process-date': {
        if (!confirm(`${fmtDateJp(t.dataset.date)}の工程履歴をすべて削除します。よろしいですか？`)) return;
        state.data.processLogs = state.data.processLogs.filter(l => l.date !== t.dataset.date);
        await saveData();
        showToast('削除しました');
        render();
        break;
      }
      case 'delete-process-log': {
        if (!confirm('この記録を削除します。よろしいですか？')) return;
        state.data.processLogs = state.data.processLogs.filter(l => l.id !== t.dataset.id);
        await saveData();
        showToast('削除しました');
        render();
        break;
      }
      case 'clear-all-process-logs': {
        if (state.data.processLogs.length === 0) return;
        if (!confirm('工程カウンターの履歴データをすべて削除します。元に戻せません。よろしいですか？')) return;
        state.data.processLogs = [];
        await saveData();
        showToast('全履歴を削除しました');
        render();
        break;
      }
      case 'export-process-csv': {
        const rows = [['日付','受注番号','工程','時間(h:mm:ss)','時間(h)']];
        state.data.processLogs
          .slice()
          .sort((a,b) => a.date.localeCompare(b.date) || a.savedAt - b.savedAt)
          .forEach(l => rows.push([l.date, l.orderNumber, l.process, fmtHM(l.seconds), roundQuarter(l.seconds / 3600)]));
        const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
        shareOrDownload('\uFEFF' + csv, `process-log-${todayStr()}.csv`, 'text/csv;charset=utf-8;');
        break;
      }
      case 'add-process-btn': {
        const name = readProcessInputs('new-process-code', 'new-process-name');
        if (!name) return;
        if (state.data.processes.includes(name)) { showToast('同じ工程がすでにあります'); return; }
        state.data.processes.push(name);
        await saveData();
        render();
        break;
      }
      case 'delete-process': {
        state.data.processes.splice(parseInt(t.dataset.idx), 1);
        await saveData();
        render();
        break;
      }
      case 'edit-process': {
        const idx = parseInt(t.dataset.idx);
        state.editingProcessIdx = idx;
        state.editProcessName = state.data.processes[idx];
        render();
        const inp = document.getElementById('edit-process-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        break;
      }
      case 'cancel-edit-process': state.editingProcessIdx = null; render(); break;
      case 'save-auto-settings': {
        const time = document.getElementById('auto-start-time').value;
        const orderDigits = document.getElementById('auto-start-order').value.replace(/\D/g, '');
        const process = document.getElementById('auto-start-process').value;
        const stopTime = document.getElementById('auto-stop-time').value;
        if (orderDigits && orderDigits.length !== 15) { showToast('受注番号は15桁で入力してください'); return; }
        if ((orderDigits && !process) || (!orderDigits && process)) { showToast('受注番号と工程は両方セットしてください'); return; }
        state.data.autoStart = { time, orderNumber: orderDigits ? formatOrderNumber(orderDigits) : '', process };
        state.data.autoStopTime = stopTime;
        await saveData();
        showToast('保存しました');
        render();
        break;
      }
      case 'save-process-name': {
        const name = readProcessInputs('edit-process-code', 'edit-process-input');
        if (!name) return;
        const idx = parseInt(t.dataset.idx);
        if (state.data.processes.some((p, i) => p === name && i !== idx)) { showToast('同じ工程がすでにあります'); return; }
        const oldName = state.data.processes[idx];
        state.data.processes[idx] = name;
        if (oldName !== name) renameProcessEverywhere(oldName, name);
        state.editingProcessIdx = null;
        await saveData();
        render();
        break;
      }
    }
  });

  // any edit inside a save group re-enables its save button
  const markDirty = (el) => {
    const g = el.closest && el.closest('[data-save-group]');
    const b = g && g.querySelector('[data-save-btn]');
    if (b && b.disabled) { b.disabled = false; b.textContent = '保存'; }
  };
  app.addEventListener('input', (e) => { markDirty(e.target); });
  app.addEventListener('change', (e) => { markDirty(e.target); });

  app.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'base-reading-input') {
      state.endDigits = el.value.replace(/\D/g, '').slice(0, 9);
      render();
      const newEl = document.getElementById('base-reading-input');
      if (newEl) { newEl.focus(); newEl.setSelectionRange(newEl.value.length, newEl.value.length); }
    } else if (el.id === 'end-reading-input') {
      state.endDigits = el.value.replace(/\D/g, '').slice(0, 9);
      render();
      const newEl = document.getElementById('end-reading-input');
      if (newEl) { newEl.focus(); newEl.setSelectionRange(newEl.value.length, newEl.value.length); }
    } else if (el.id === 'auto-start-order') {
      const formatted = formatOrderNumber(el.value.replace(/\D/g, '').slice(0, 15));
      el.value = formatted;
      requestAnimationFrame(() => el.setSelectionRange(formatted.length, formatted.length));
    } else if (el.id === 'new-process-code' || el.id === 'edit-process-code') {
      el.value = el.value.replace(/\D/g, '').slice(0, 3);
    } else if (el.id === 'edit-start-reading-input') {
      state.editStartDigits = el.value.replace(/\D/g, '').slice(0, 9);
      const formatted = digitsToDisplay(state.editStartDigits);
      el.value = formatted;
      const pos = formatted.length;
      requestAnimationFrame(() => el.setSelectionRange(pos, pos));
    } else if (el.id === 'order-number-input') {
      const machine = getMachine(state.selectedMachineId);
      const digits = el.value.replace(/\D/g, '').slice(0, 15);
      machine.pendingOrderDigits = digits;
      const formatted = formatOrderNumber(digits);
      el.value = formatted;
      const pos = formatted.length;
      requestAnimationFrame(() => el.setSelectionRange(pos, pos));
      saveData();
      const btn = document.getElementById('save-cycle-btn');
      if (btn) btn.disabled = !(orderNumberDigitCount(machine.pendingOrderDigits) === 15 && digitsToMinutes(state.endDigits) !== null);
    } else if (el.id === 'edit-machine-input') {
      state.editMachineName = el.value;
    } else if (el.id === 'edit-reason-input') {
      state.editReasonName = el.value;
    } else if (el.id === 'edit-process-input') {
      state.editProcessName = el.value;
    } else if (el.id === 'new-order-input') {
      state.newOrderDigits = el.value.replace(/\D/g, '').slice(0, 15);
      const formatted = formatOrderNumber(state.newOrderDigits);
      el.value = formatted;
      const pos = formatted.length;
      requestAnimationFrame(() => el.setSelectionRange(pos, pos));
      const btn = document.getElementById('add-order-btn');
      if (btn) btn.disabled = orderNumberDigitCount(state.newOrderDigits) !== 15;
    } else if (el.id === 'edit-order-input') {
      state.editOrderDigits = el.value.replace(/\D/g, '').slice(0, 15);
      const formatted = formatOrderNumber(state.editOrderDigits);
      el.value = formatted;
      const pos = formatted.length;
      requestAnimationFrame(() => el.setSelectionRange(pos, pos));
      const btn = app.querySelector('[data-action="save-order-number"]');
      if (btn) btn.disabled = orderNumberDigitCount(state.editOrderDigits) !== 15;
    }
  });

  app.addEventListener('change', async (e) => {
    const el = e.target;
    if (el.id === 'machine-select') {
      state.selectedMachineId = el.value;
      state.endDigits = '';
      state.stopReasons = [];
      render();
    } else if (el.id === 'history-filter') {
      state.historyFilterMachine = el.value;
      render();
    } else if (el.id === 'import-file-input') {
      const file = el.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const parsed = JSON.parse(text);
        if (!parsed.machines || !parsed.stopReasons || !parsed.logs) throw new Error('形式が不正です');
        if (!confirm('現在のデータを上書きして復元します。よろしいですか？')) return;
        state.data = parsed;
        if (!state.data.processes) state.data.processes = ['CAD/CAM', '段取り', '工程内検査', 'プログラム作成', 'その他'];
        if (!state.data.activeOrders) state.data.activeOrders = [];
        if (!state.data.processLogs) state.data.processLogs = [];
        if (!state.data.breaks) state.data.breaks = [
          { id: uid(), name: '昼休み', start: '12:00', end: '12:50' },
          { id: uid(), name: '中休み', start: '15:00', end: '15:10' },
          { id: uid(), name: '夕休み', start: '17:30', end: '17:45' }
        ];
        if (!state.data.dayShiftStart) state.data.dayShiftStart = '08:30';
  if (!state.data.dayShiftEnd) state.data.dayShiftEnd = '17:30';
  if (!state.data.autoStart) state.data.autoStart = { time: '08:30', orderNumber: '', process: '' };
  if (state.data.autoStopTime === undefined) state.data.autoStopTime = '';
        await saveData();
        showToast('復元しました');
        render();
      } catch (err) {
        alert('読み込みに失敗しました: ' + err.message);
      }
      el.value = '';
    }
  });
}

// accumulate a running order's elapsed time into its totals (called before pausing/switching)
// Time since lastResumeAt, split by time slot. This keeps the numbers right even when
// the app was suspended (screen locked / closed) across a break or the 日勤/残業 boundary.
function minutesOfDayAt(ms) { const x = new Date(ms); return x.getHours() * 60 + x.getMinutes() + x.getSeconds() / 60; }
function isBreakAtMs(ms) {
  const m = minutesOfDayAt(ms);
  return (state.data.breaks || []).some(b => m >= timeStrToMinutes(b.start) && m < timeStrToMinutes(b.end));
}
function isDayShiftAtMs(ms) {
  const m = minutesOfDayAt(ms);
  return m >= timeStrToMinutes(state.data.dayShiftStart || '08:30') && m < timeStrToMinutes(state.data.dayShiftEnd || '17:30');
}
function pendingBuckets(order, untilMs) {
  const out = {};
  if (!order.running || !order.lastResumeAt || !order.currentProcess || untilMs <= order.lastResumeAt) return out;
  const from = order.lastResumeAt, to = untilMs;
  const marks = [state.data.dayShiftStart, state.data.dayShiftEnd, ...(state.data.breaks || []).flatMap(b => [b.start, b.end])].filter(Boolean);
  const cuts = [from, to];
  const day = new Date(from); day.setHours(0, 0, 0, 0);
  for (let i = 0; i < 400 && day.getTime() < to; i++) {
    marks.forEach(t => { const ms = msAtTimeOnDate(day, t); if (ms > from && ms < to) cuts.push(ms); });
    day.setDate(day.getDate() + 1);
  }
  cuts.sort((a, b) => a - b);
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i], b = cuts[i + 1];
    if (b <= a) continue;
    const mid = (a + b) / 2;
    if (!order.breakOverride && isBreakAtMs(mid)) continue;
    const key = isDayShiftAtMs(mid) ? order.currentProcess : order.currentProcess + OVERTIME_SUFFIX;
    out[key] = (out[key] || 0) + (b - a) / 1000;
  }
  return out;
}
function pendingSeconds(order) {
  return Object.values(pendingBuckets(order, Date.now())).reduce((s, v) => s + v, 0);
}
function orderLiveTotalSeconds(o) { return orderTotalSeconds(o) + pendingSeconds(o); }
function flushOrderUntil(order, untilMs) {
  Object.entries(pendingBuckets(order, untilMs)).forEach(([k, v]) => { order.totals[k] = (order.totals[k] || 0) + v; });
}
function flushOrder(order) {
  flushOrderUntil(order, Date.now());
  order.lastResumeAt = Date.now();
}

// ---------- break-time auto pause/resume (昼休み・中休みなど) ----------
function nowMinutesOfDay() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function timeStrToMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
function getCurrentBreak() {
  if (!state.data || !state.data.breaks) return null;
  const nowMin = nowMinutesOfDay();
  return state.data.breaks.find(b => {
    const s = timeStrToMinutes(b.start), e = timeStrToMinutes(b.end);
    return nowMin >= s && nowMin < e;
  }) || null;
}
async function checkBreaksAndAutoSwitch() {
  if (!state.data || !state.data.activeOrders || state.data.activeOrders.length === 0) return;
  const onBreakNow = !!getCurrentBreak();
  let changed = false;

  state.data.activeOrders.forEach(o => {
    if (onBreakNow) {
      // auto-pause running cards, except one the user deliberately started during this break
      if (o.running && !o.onBreak && !o.breakOverride) {
        flushOrder(o);
        o.running = false;
        o.lastResumeAt = null;
        o.onBreak = true;
        changed = true;
      }
    } else {
      if (o.breakOverride) { flushOrder(o); o.breakOverride = false; changed = true; }
      if (o.onBreak) {
        o.onBreak = false;
        o.running = true;
        o.lastResumeAt = Date.now();
        o.activeBucketKey = effectiveBucketKey(o);
        changed = true;
      }
    }
  });

  if (changed) {
    await saveData();
    render();
  }
}

// ---------- overtime auto-switch (17:45〜 default, editable) ----------
// ---------- day-shift / overtime boundary watcher ----------
// runs continuously (not a one-shot flag): whenever a running order's effective
// bucket (process + day-shift-vs-overtime) changes underneath it, split the time
// precisely at that moment so the totals stay correctly attributed either way,
// even across a finalize + restart within the same day.
async function checkShiftBoundaryAutoSplit() {
  if (!state.data || !state.data.activeOrders || state.data.activeOrders.length === 0) return;
  let changed = false;

  state.data.activeOrders.forEach(o => {
    if (!o.running || o.onBreak || !o.currentProcess) return;
    const freshKey = effectiveBucketKey(o);
    if (o.activeBucketKey !== freshKey) {
      flushOrder(o); // closes out whatever was accumulating under the OLD key, up to now
      o.activeBucketKey = freshKey;
      changed = true;
    }
  });

  if (changed) {
    await saveData();
    render();
  }
}

// ---------- 始業の自動開始・終業の自動停止 ----------
function msAtTimeOnDate(dateObj, hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(dateObj.getTime());
  d.setHours(h, m, 0, 0);
  return d.getTime();
}
async function checkAutoStop() {
  const t = state.data && state.data.autoStopTime;
  if (!t || !state.data.activeOrders.length) return;
  const today = todayStr();
  const nowD = new Date();
  let stopped = 0;

  // a card left running from a previous day: close it at that day's 終業 time
  state.data.activeOrders.forEach(o => {
    if (!o.running || !o.lastResumeAt) return;
    const started = new Date(o.lastResumeAt);
    if (started.toDateString() === nowD.toDateString()) return;
    let endMs = msAtTimeOnDate(started, t);
    if (endMs <= o.lastResumeAt) endMs = msAtTimeOnDate(started, '23:59') + 60000;
    flushOrderUntil(o, endMs);
    o.running = false; o.lastResumeAt = null; o.onBreak = false; o.breakOverride = false;
    stopped++;
  });

  if (state.data.autoStopDoneDate !== today && nowMinutesOfDay() >= timeStrToMinutes(t)) {
    const endMs = msAtTimeOnDate(nowD, t);
    state.data.activeOrders.forEach(o => {
      // cards started manually after 終業 keep running
      if (o.running && o.lastResumeAt && o.lastResumeAt < endMs) {
        flushOrderUntil(o, endMs);
        o.running = false; o.lastResumeAt = null;
        stopped++;
      }
      o.onBreak = false; o.breakOverride = false;
    });
    state.data.autoStopDoneDate = today;
    await saveData();
    if (stopped) showToast(`終業時刻（${t}）でカウンターを止めました`);
    render();
    return;
  }
  if (stopped) { await saveData(); showToast('前日から動いたままのカウンターを終業時刻で止めました'); render(); }
}
async function checkAutoStart() {
  const a = state.data && state.data.autoStart;
  if (!a || !a.time || orderNumberDigitCount(a.orderNumber) !== 15 || !a.process) return;
  const today = todayStr();
  if (state.data.autoStartDoneDate === today) return;
  const now = nowMinutesOfDay(), s = timeStrToMinutes(a.time);
  if (now < s) return;
  state.data.autoStartDoneDate = today; // once per day
  if (now >= s + AUTO_START_GRACE_MIN || state.data.activeOrders.some(o => o.running)) { await saveData(); return; }

  let order = state.data.activeOrders.find(o => o.orderNumber === a.orderNumber);
  if (!order) {
    order = { id: uid(), orderNumber: a.orderNumber, currentProcess: null, running: false, lastResumeAt: null,
              totals: {}, onBreak: false, preBreakProcess: null, activeBucketKey: null };
    state.data.activeOrders.push(order);
  }
  state.data.activeOrders.forEach(o => { if (o.id !== order.id) { o.onBreak = false; o.breakOverride = false; } });
  order.currentProcess = a.process;
  order.running = true;
  order.lastResumeAt = msAtTimeOnDate(new Date(), a.time); // さかのぼって始業時刻から
  order.onBreak = false;
  order.breakOverride = false;
  order.activeBucketKey = effectiveBucketKey(order);
  state.data.activeOrders = [order, ...state.data.activeOrders.filter(o => o.id !== order.id)];
  await saveData();
  showToast(`始業：${a.orderNumber} ${a.process} で開始しました`);
  render();
}

// lightweight per-second refresh of visible timers without a full re-render
setInterval(async () => {
  await checkAutoStop();
  await checkAutoStart();
  await checkBreaksAndAutoSwitch();
  await checkShiftBoundaryAutoSplit();
  if (state.mode !== 'process' || state.tabByMode.process !== 'record') return;
  const anyRunning = state.data && state.data.activeOrders.some(o => o.running);
  if (!anyRunning) return;
  let needRender = false;
  state.data.activeOrders.forEach(o => {
    const totalEl = document.querySelector(`[data-timer-total="${o.id}"]`);
    if (totalEl) totalEl.innerHTML = fmtDualTime(orderLiveTotalSeconds(o));
    if (o.running && o.currentProcess) {
      Object.keys(pendingBuckets(o, Date.now())).forEach(key => {
        const procEl = document.querySelector(`[data-timer-proc="${o.id}:${key}"]`);
        if (procEl) procEl.innerHTML = fmtDualTime(orderCurrentDisplaySeconds(o, key));
        else needRender = true;
      });
    }
  });
  if (needRender) render();
}, 1000);

async function handleSaveBase() {
  const machine = getMachine(state.selectedMachineId);
  const minutes = digitsToMinutes(state.endDigits);
  if (minutes === null) return;
  machine.lastReadingMinutes = minutes;
  machine.lastReadingDigits = state.endDigits;
  machine.lastDate = todayStr();
  machine.pendingOrderDigits = '';
  await saveData();
  state.endDigits = '';
  showToast('基準として保存しました');
  render();
}

async function handleSaveCycle() {
  const machine = getMachine(state.selectedMachineId);
  const endMinutes = digitsToMinutes(state.endDigits);
  const orderComplete = orderNumberDigitCount(machine.pendingOrderDigits) === 15;
  if (endMinutes === null || !orderComplete) return;

  const rawElapsedHours = Math.max(0, endMinutes - machine.lastReadingMinutes) / 60;
  const elapsed = roundQuarter(rawElapsedHours);
  const log = {
    id: uid(),
    date: todayStr(),
    machineId: machine.id,
    startMinutes: machine.lastReadingMinutes,
    endMinutes: endMinutes,
    elapsedHours: elapsed,
    rawElapsedHours: rawElapsedHours,
    orderNumber: formatOrderNumber(machine.pendingOrderDigits),
    stopReasons: [...state.stopReasons],
    savedAt: Date.now()
  };
  state.data.logs.push(log);
  machine.lastReadingMinutes = endMinutes;
  machine.lastReadingDigits = state.endDigits;
  machine.lastDate = todayStr();
  await saveData();
  state.endDigits = '';
  state.stopReasons = [];
  showToast('記録を保存しました');
  render();
}

function exportCsv() {
  const rows = [['日付','機械','受注番号','停止理由','経過時間(h)','丸め前経過時間(h)','開始値','終了値']];
  state.data.logs
    .slice()
    .sort((a,b) => a.date.localeCompare(b.date) || a.savedAt - b.savedAt)
    .forEach(l => {
      const machine = getMachine(l.machineId);
      const reasons = l.stopReasons || (l.stopReason ? [l.stopReason] : []);
      rows.push([
        l.date, machine?.name || '', l.orderNumber, reasons.join(' / '),
        l.elapsedHours, (l.rawElapsedHours !== undefined ? Math.round(l.rawElapsedHours * 100) / 100 : ''),
        minutesToDisplay(l.startMinutes), minutesToDisplay(l.endMinutes)
      ]);
    });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  shareOrDownload('\uFEFF' + csv, `machine-log-${todayStr()}.csv`, 'text/csv;charset=utf-8;');
}

(async function init() {
  bindDelegatedHandlers();
  await loadData();
  render();
})();
</script>
